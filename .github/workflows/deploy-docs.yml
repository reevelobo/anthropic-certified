name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_SITE_URL: https://reevelobo.github.io/anthropic-certified/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure theme override path exists
        run: mkdir -p docs/overrides/partials

      - name: Build and deploy to gh-pages branch
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python -m mkdocs gh-deploy --force --clean --verbose --site-url "$PAGES_SITE_URL"
