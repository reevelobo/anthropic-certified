site_name: Claude Certifications
site_description: >-
  Comprehensive study guide for Anthropic Claude certifications, including
  Developer Foundations, modules, badges, prompting, agents, tools, MCP,
  evals, security, and related learning paths.
site_author: Reeve Lobo
site_url: https://reevelobo.github.io/anthropic-certified/
repo_name: reevelobo/anthropic-certified
repo_url: https://github.com/reevelobo/anthropic-certified
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - announce.dismiss

extra_css:
  - stylesheets/ibm-theme.css

extra_javascript:
  - javascripts/ibm-extra.js

plugins:
  - search:
      lang: en
  - mkdocs-jupyter:
      include:
        - "01.making_a_request.ipynb"
        - "02.chat_bot_excercise.ipynb"
        - "03.system_prompts.ipynb"
        - "04.sys_prompt_exercise.ipynb"
        - "05.temperature.ipynb"
        - "06.response_streaming.ipynb"
        - "07.structured_data.ipynb"
        - "08.structured_data_exercise.ipynb"
        - "09.prompt_evals.ipynb"
        - "10.prompt_evals_exercise.ipynb"
        - "001_prompting.ipynb"
        - "002_prompting_completed.ipynb"
        - "11.prompting.ipynb"
        - "12.tools.ipynb"
      execute: false
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/reevelobo
  generator: false

copyright: Copyright &copy; 2025 Reeve Lobo

